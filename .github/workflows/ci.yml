name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test HubCore
        working-directory: app
        run: swift test
      - name: Build app bundle
        env:
          # LINE21's release signing key (public half). Only packages signed with the private key install.
          PUBLIC_KEY: ${{ vars.LINE21_SIGNING_PUBLIC_KEY || '/3r74rUkqg4MgBCdyWwHalNodW/0Nlz9BewS1T3ylaI=' }}
          CATALOG_URL: ${{ vars.LINE21_CATALOG_URL || 'https://api-production-c9ef3b74.up.railway.app' }}
          VERSION: 0.1.${{ github.run_number }}
        run: app/scripts/build-app.sh
      - name: Zip app
        run: cd app/dist && ditto -c -k --keepParent "LINE21 Hub.app" LINE21-Hub.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LINE21-Hub
          path: app/dist/LINE21-Hub.zip
